core:
  - all:
      - changed-files:
          - any-glob-to-any-file: "lua/github_theme/**"
          - all-globs-to-all-files:
              - "!lua/github_theme/groups/**"
              - "!lua/github_theme/colors.lua"
              - "!lua/github_theme/palette.lua"
              - "!lua/github_theme/extra/**"

extras:
  - changed-files:
      - any-glob-to-any-file: "lua/github_theme/extra/**"

groups:
  - changed-files:
      - any-glob-to-any-file: "lua/github_theme/groups/**"

base:
  - changed-files:
      - any-glob-to-any-file:
          - "lua/github_theme/groups/base.lua"
          - "lua/github_theme/groups/kinds.lua"
          - "lua/github_theme/groups/treesitter.lua"
          - "lua/github_theme/groups/semantic_tokens.lua"
          - "lua/github_theme/groups/gti.lua"

colors:
  - changed-files:
      - any-glob-to-any-file:
          - "lua/github_theme/colors.lua"
          - "lua/github_theme/palette.lua"
