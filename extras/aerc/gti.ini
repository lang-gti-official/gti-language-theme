# vim: ft=dosini
#
# aerc GTI Theme styleset
# set styleset-name=gti.ini in 'aerc.conf' to load the style
#

*.default=true
*.normal=true

border.fg=#6e7681
border.bg=#24292e

title.fg=#1d2125
title.bg=#388bfd
title.bold=true

header.fg=#ff7b72
#header.bg=#24292e
header.bold=true

tab.fg=#6e7681
tab.bg=#1f2428
tab.selected.fg=#1d2125
tab.selected.bg=#388bfd

statusline_default.fg=#e6edf3
statusline_default.bg=#1f2428
statusline_error.fg=#da3633
statusline_success.fg=#e6edf3

*error.bold=true
*error.fg=#da3633
*warning.fg=#FFAB70
*success.fg=#e6edf3

dirlist_*.bg=#24292e
dirlist_*.fg=#e6edf3
dirlist_*.selected.bg=#2e3c5c
dirlist_*.selected.fg=#e6edf3

msglist_*.bg=#24292e
msglist_*.fg=#e6edf3
msglist_*.selected.bg=#2e3c5c
#msglist_*.selected.fg=#e6edf3
msglist_unread.bold=true
msglist_unread.fg=#388bfd
msglist_marked.fg=#f0883e
msglist_thread_folded.italic=true
msglist_thread_folded.underline=true
msglist_gutter.bg=#343b42
msglist_pill.bg=#6e7681
msglist_pill.reverse=false

part_*.fg=#e6edf3
part_*.bg=#1f2428
part_*.selected.fg=#e6edf3
part_*.selected.bg=#6e7681

completion_default.bg=#1f2428
completion_default.fg=#e6edf3
completion_default.selected.bg=#6e7681
completion_default.selected.fg=#e6edf3
completion_gutter.bg=#343b42
completion_pill.bg=#6e7681
completion_pill.reverse=false

spinner.bg=#24292e
spinner.fg=#e6edf3

selector_focused.bold=false
selector_focused.bg=#2e3c5c
selector_focused.fg=#e6edf3
selector_chooser.bold=false
selector_chooser.bg=#2e3c5c
selector_chooser.fg=#e6edf3
default.selected.bold=false
default.selected.fg=#e6edf3
default.selected.bg=#2e3c5c

[viewer]
url.underline=true
url.fg=#737aa2
header.fg=#B392F0
signature.fg=#bb9af7
diff_add.fg=#555a5f
diff_del.fg=#522c2f
diff_meta.bold=true
diff_chunk.dim=true
quote_1.fg=#FFAB70
quote_2.fg=#e6edf3
quote_3.fg=#1abc9c
quote_3.dim=true
quote_4.fg=#388bfd
quote_4.dim=true
quote_x.fg=#8b949e
quote_x.dim=true

